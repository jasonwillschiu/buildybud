schema_version = 1
module_path = "github.com/jasonwillschiu/buildybud"
strict = true

[paths]
repo_root = "."
assets_root = "."
manifest_path = "manifest.json"

[css]
enabled = false
command = "tailwindcss"
input = "assets/src/css/input.css"
output = "assets/embed/assets/css/app.css"
content = ["feature/**/*.templ", "feature/**/*.go", "ui/**/*.templ", "assets/src/templui/**/*.templ"]
minify = true

[js]
enabled = false
out_dir = "assets/embed/assets/js"
hash_length = 8
src_dirs = ["assets/src/js"]
copy_dirs = ["assets/src/templui/assets/js"]
scan_template_dirs = ["ui", "feature"]
templui_component_dir = "assets/src/templui/assets/js"

[js.dependencies]
sheet = ["dialog"]
dropdown = ["popover"]
selectbox = ["input", "popover"]
datepicker = ["input", "popover"]
timepicker = ["input", "popover"]
tagsinput = ["popover"]

[manifest]
hash_length = 8
cleanup_stale = true

[og]
enabled = false
site_name = ""
site_url = ""
background = "assets/src/images/og/background.png"
logo = "assets/src/favicon/web-app-manifest-192x192.png"
font = "assets/src/fonts/og/OpenSans-Bold.ttf"
routes_file = "content/seo/routes.toml"
route_output_dir = "assets/src/images/og"
route_manifest = "assets/src/images/og/generated-manifest.json"
blog_dir = "content/blog"
blog_image_dir = "assets/src/images/blog"
raw_blog_image_dir = "assets/src/raw-images/blog"
blog_manifest = "assets/src/images/blog/generated-manifest.json"

[images]
enabled = false
config_path = "tools/imageopt/config.json"

[favicon]
enabled = false
source_dir = "assets/src/favicon"
out_dir = "assets/embed/assets/favicon"
clean = true

[templui_map]
enabled = false
mode = "declarative"
out = "core/templui/generated_routes.go"
component_dir = "assets/src/templui/assets/js"
default_components = ["dialog"]
longest_prefix_match = true
fail_on_missing_component = true

[templui_map.suggest]
enabled = true
scan_router = "core/router/router.go"
scan_dirs = ["ui", "feature"]
